name: Bug report
description: Something in RxPlus doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please don't include your own medications, conditions or doses.** Use made-up examples (e.g. lisinopril 10 MG). Security problems go through the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you're running (`git log --oneline -1`).
  - type: dropdown
    id: where
    attributes:
      label: Where does it run?
      options:
        - Docker Compose (home server)
        - npm run dev
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From `docker compose logs app`, with any names or medications removed.
      render: text
