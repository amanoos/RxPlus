<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RxPlus</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Applies the saved theme (or the OS setting) before first paint, so a
         server-rendered page never flashes the wrong theme. See core/theme.ts. -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('rxplus-theme');
        } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('app-dark');
      })();
    </script>
    <!-- Bricolage Grotesque (headings) and DM Sans (text): see docs/design.md. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
