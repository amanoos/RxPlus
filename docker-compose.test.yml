# Throwaway database for integration tests (data in tmpfs):
#   npm run db:test:up
name: rxplus-test

services:
  db-test:
    image: postgres:18
    # A statement stuck behind another connection's lock fails after 3 s with
    # "canceling statement due to lock timeout" instead of an unexplained test timeout.
    command: ['postgres', '-c', 'lock_timeout=3s']
    environment:
      POSTGRES_USER: rxplus
      POSTGRES_PASSWORD: rxplus
      POSTGRES_DB: rxplus_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rxplus -d rxplus_test']
      interval: 2s
      timeout: 3s
      retries: 15
