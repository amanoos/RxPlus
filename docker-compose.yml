name: rxplus

services:
  app:
    build:
      context: .
      args:
        VITE_PRIMEUI_LICENSE: ${VITE_PRIMEUI_LICENSE:-}
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      # Inside Compose the database host is `db`, whatever .env says for local dev.
      DATABASE_URL: postgres://rxplus:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/rxplus
      PORT: '3000'
      TZ: ${TZ:-America/New_York}
      # Ollama runs on the Docker host (with OLLAMA_HOST=0.0.0.0, see README), whatever
      # .env says for local dev. Change this if it runs on another machine.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      # Linux needs this mapping for host.docker.internal (Docker Desktop has it built in).
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: rxplus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rxplus
      TZ: ${TZ:-America/New_York}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rxplus -d rxplus']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
