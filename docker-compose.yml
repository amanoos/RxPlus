name: rxplus

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: rxplus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rxplus
      TZ: ${TZ:-America/New_York}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rxplus -d rxplus']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
